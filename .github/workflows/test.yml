name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the Windows-only code (keyboard hook, glass); Linux
        # keeps the shared code honest about not depending on Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri's build script checks that the frontend folder exists.
      - name: Placeholder frontend build
        shell: bash
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tests (includes bindings freshness check)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # File search talks to the real Everything, so install and start it,
      # then run the tests that need it (marked #[ignore] for local runs).
      - name: Install and start Everything
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install everything --no-progress -y
          Start-Process "$env:ProgramFiles\Everything\Everything.exe" -ArgumentList "-startup"
      - name: Tests against real Everything
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml everything -- --ignored --nocapture
