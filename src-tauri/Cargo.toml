[package]
name = "desktop-assistant"
version = "0.1.0"
description = "Personal Raycast-style launcher for Windows"
edition = "2021"
rust-version = "1.85"
default-run = "desktop-assistant"

[lib]
# Distinct lib name avoids a Windows linker clash between the bin and lib.
name = "desktop_assistant_lib"
crate-type = ["rlib"]

[[bin]]
name = "gen-bindings"
path = "src/bin/gen-bindings.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
nucleo-matcher = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
png = "0.18"
base64 = "0.22"
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tauri-plugin-opener = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.5"
# Calculator: math, units and currency, with a time limit per evaluation.
fend-core = "1.5"
# Emoji picker: names, GitHub shortcodes and skin tones (Unicode data).
emojis = "0.9"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_System_LibraryLoader",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Debug builds keep line numbers for backtraces but skip full debug info:
# much smaller and faster to link. Dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
